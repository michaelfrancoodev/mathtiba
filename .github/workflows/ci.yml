name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Math engine + pipeline tests
        run: npm test

      - name: Regenerate validation harness
        run: npm run harness

      - name: Production build
        run: npm run build

      - name: Upload harness results
        uses: actions/upload-artifact@v4
        with:
          name: validation-harness-results
          path: harness/results.json
